<!doctype html>
<html lang="ms" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>اخلاق — درجه 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Vazirmatn:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1B4B43; --pine-d:#123330; --rust:#8C4426; --brass:#C9A227; --brass-d:#8E7118;
  --bg:#EFEAE0; --card:#FBF8F1; --ink:#23302C; --ink-soft:#5B6560; --line:#D9D2C1;
  --green:#2F7D52; --red:#B23A2E; --shadow:0 2px 10px rgba(20,25,20,.08);
  --radius:14px; --header-h:56px; --counter-h:46px;
}
[data-theme="dark"]{
  --bg:#14211E; --card:#1B2B27; --ink:#E8E3D6; --ink-soft:#AEB6AC; --line:#33443E;
  --pine:#4E9C86; --rust:#C97A54; --brass:#E4C25A; --brass-d:#B99A32;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Vazirmatn','Scheherazade New',serif;
  direction:rtl; min-height:100vh;
}
.latin{font-family:'Work Sans',sans-serif;}
h1,h2,h3,.jawi-head{font-family:'Scheherazade New',serif; font-weight:700;}
button{font-family:inherit; direction:rtl;}
:focus-visible{outline:3px solid var(--brass); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important;} }

/* ---------- sticky header + counter (attached, all pages, always) ---------- */
.app-header{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line);
}
.tabbar{
  display:flex; height:var(--header-h);
}
.tabbar button{
  flex:1; background:none; border:none; font-size:1.15rem; color:var(--ink-soft);
  border-bottom:3px solid transparent; cursor:pointer;
}
.tabbar button.active{ color:var(--pine); border-bottom-color:var(--brass); font-weight:700; }
[data-theme="dark"] .tabbar button.active{ color:var(--brass); }
.theme-toggle{
  width:48px; background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--ink-soft);
}

/* ---------- Mizan progress bar: the one signature element ----------
   A brass beam with a fulcrum triangle; each fasal's 10 sections hang
   as a cluster of segment-weights either side, tipping toward whichever
   side (green=mastered / red=needs work) currently outweighs the other. */
.counter-bar{ height:var(--counter-h); padding:0 10px; display:flex; align-items:center; gap:10px; overflow-x:auto; }
.counter-total{ font-size:.95rem; white-space:nowrap; color:var(--ink-soft); flex:0 0 auto; }
.counter-total b{ color:var(--pine); }
[data-theme="dark"] .counter-total b{ color:var(--brass); }
.mizan-track{ display:flex; gap:12px; flex:1 1 auto; overflow-x:auto; }
.mizan-cluster{ display:flex; flex-direction:column; align-items:center; flex:0 0 auto; padding:2px 4px; }
.mizan-cluster .seg-row{ display:flex; gap:3px; }
.seg{ width:8px; height:16px; border-radius:2px; border:1.4px solid var(--brass-d); background:transparent; padding:0; cursor:pointer; }
.seg.faded{ background:var(--brass); opacity:.35; }
.seg.solid{ background:var(--brass); opacity:.85; }
.seg.green{ background:var(--green); border-color:var(--green); }
.seg.red{ background:var(--red); border-color:var(--red); }
.mizan-cluster .fasal-label{ font-size:.62rem; color:var(--ink-soft); margin-top:2px; max-width:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:none; border:none; cursor:pointer; padding:0; font-family:inherit; }
.correct-readout{ font-size:.85rem; color:var(--green); white-space:nowrap; flex:0 0 auto; }

/* ---------- page content ---------- */
.page{ display:none; padding:14px; max-width:720px; margin:0 auto; }
.page.active{ display:block; }

/* ---------- notes ---------- */
.fasal-tabs{ display:flex; overflow-x:auto; gap:6px; margin-bottom:12px; }
.fasal-tabs button{ flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:1rem; color:var(--ink); cursor:pointer; }
.fasal-tabs button.active{ background:var(--pine); color:#fff; border-color:var(--pine); }
.card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
.dalil-box{ border:2px solid var(--brass); border-radius:var(--radius); padding:16px; background:linear-gradient(180deg,var(--card),transparent); margin-bottom:14px; }
.ayat-ar{ font-size:1.5rem; line-height:2.4; text-align:center; margin-bottom:8px; }
.ayat-ref{ text-align:center; color:var(--brass-d); font-size:.9rem; margin-bottom:8px; }
.ayat-meaning{ font-size:1.05rem; }
.hadith-note{ font-size:.85rem; color:var(--ink-soft); border-right:3px solid var(--rust); padding-right:8px; margin-top:6px;}
.key-points{ padding-right:20px; }
.key-points li{ margin-bottom:6px; }
table.ref-table{ width:100%; border-collapse:collapse; margin:10px 0; }
table.ref-table th,table.ref-table td{ border:1px solid var(--line); padding:8px; text-align:right; font-size:.95rem; }
table.ref-table th{ background:var(--pine); color:#fff; }

/* mind map: pure HTML/CSS branching (no SVG, jawi width unpredictable) */
.mindmap{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.mindmap .root{ background:var(--pine); color:#fff; border-radius:10px; padding:8px 14px; font-weight:700; align-self:center; }
.mindmap .branches{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:100%; border-top:2px dashed var(--brass); padding-top:8px; }
.mindmap .branch{ background:var(--card); border:1.5px solid var(--brass); border-radius:10px; padding:8px 12px; min-width:120px; }
.mindmap .branch .leafs{ margin-top:6px; font-size:.85rem; color:var(--ink-soft); padding-right:14px; }

.tip-box{ background:var(--card); border-right:4px solid var(--rust); border-radius:8px; padding:10px 14px; margin-top:8px; }

/* ---------- quiz ---------- */
.section-badge{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background:var(--pine); color:#fff; font-size:.9rem; margin-left:8px; }
[data-theme="dark"] .section-badge{ background:var(--brass); color:#14211E; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.section-score{ font-size:1rem; color:var(--ink-soft); }
.q-block{ border-bottom:1px solid var(--line); padding:12px 0; }
.pair-row{ margin-bottom:8px; }
.pair-row .q-stem{ margin-bottom:4px; font-size:.98rem; }
.q-stem{ margin-bottom:8px; font-size:1.05rem; }
.opt-row{ display:flex; align-items:center; gap:8px; padding:8px; border-radius:8px; border:1px solid var(--line); margin-bottom:6px; cursor:pointer; background:var(--card);}
.opt-row.marked-correct{ border-color:var(--green); background:color-mix(in srgb, var(--green) 12%, var(--card)); }
.opt-row.marked-wrong{ border-color:var(--red); background:color-mix(in srgb, var(--red) 12%, var(--card)); }
.mark-icon{ font-size:1rem; }
.reveal-btn{ font-size:.85rem; color:var(--rust); background:none; border:1px solid var(--rust); border-radius:8px; padding:4px 10px; cursor:pointer; margin-top:4px; }
mark.hl{ background:none; color:var(--rust); font-weight:700; }
[data-theme="dark"] mark.hl{ color:var(--brass); }
.key-points li::marker{ color:var(--brass-d); }
.reveal-answer{ display:none; margin-top:6px; font-size:.9rem; color:var(--ink-soft); }
.reveal-answer.shown{ display:block; }
.drop-slot{ display:inline-block; min-width:70px; border-bottom:2px dashed var(--brass); padding:2px 6px; margin:0 3px; text-align:center; }
.drop-slot.filled{ border-style:solid; }
.word-bank{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.word-chip{ background:var(--card); border:1.5px solid var(--pine); border-radius:8px; padding:6px 12px; cursor:pointer; }
.word-chip.used{ opacity:.35; pointer-events:none; }
.match-col{ display:flex; flex-direction:column; gap:6px; }
.order-list{ list-style:none; padding:0; }
.order-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.order-handle{ cursor:grab; }
.bin{ border:1.5px dashed var(--brass); border-radius:10px; padding:8px; min-height:44px; margin-bottom:8px; }
.bin-title{ font-weight:700; font-size:.9rem; margin-bottom:6px; }
.section-actions{ display:flex; gap:10px; margin-top:12px; }
.btn{ border:none; border-radius:10px; padding:10px 18px; font-size:1rem; cursor:pointer; }
.btn-submit{ background:var(--pine); color:#fff; }
.btn-reset{ background:none; border:1.5px solid var(--rust); color:var(--rust); }

/* ---------- glossary ---------- */
.search-box{ width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--line); font-size:1.05rem; margin-bottom:10px; background:var(--card); color:var(--ink); }
.filter-chips{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; }
.filter-chips button{ flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:.85rem; cursor:pointer; }
.filter-chips button.active{ background:var(--brass); border-color:var(--brass); color:#14211E; }
.gloss-item{ padding:10px 0; border-bottom:1px solid var(--line); }
.gloss-term{ font-weight:700; font-size:1.1rem; color:var(--pine); }
[data-theme="dark"] .gloss-term{ color:var(--brass); }
.gloss-fasal-tag{ font-size:.75rem; color:var(--ink-soft); }

.footer-note{ text-align:center; font-size:.8rem; color:var(--ink-soft); padding:20px 0; }
.saved-at{ text-align:center; font-size:.8rem; color:var(--ink-soft); }
.clear-all-btn{ display:block; margin:8px auto; background:none; border:1px solid var(--red); color:var(--red); border-radius:10px; padding:6px 14px; font-size:.85rem; cursor:pointer; }

@media (max-width:390px){
  .ayat-ar{ font-size:1.3rem; }
  .tabbar button{ font-size:1rem; }
}

</style>
</head>
<body>
<div class="app-header" id="app-header"></div>

<main>
  <div class="page active" id="page-notes"></div>
  <div class="page" id="page-quiz"></div>
  <div class="page" id="page-gloss"></div>
</main>

<div class="footer-note">اڤليكاسي اولڠكاجي اخلاق &middot; دبينا خصوص اونتوق كݢوناءن ڤريبادي</div>

<script>
/* ============================================================
   AKHLAK APP ENGINE
   Data-driven renderers for the 10 quiz section types.
   Built first, tested with synthetic data, THEN wired to real content.
   ============================================================ */

const AR_NUM = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArNum(n){
  return String(n).split('').map(c => /[0-9]/.test(c) ? AR_NUM[+c] : c).join('');
}

/* ---------- shuffle (Fisher-Yates, seeded per-question so re-render is stable) ---------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rnd = mulberry32(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// simple string hash -> seed, so the same question id always shuffles the same way
function strSeed(s){
  let h = 0;
  for (let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return h;
}

/* ============================================================
   STATE
   answers: { [qid]: currentAnswerValue }   -- always current, not locked
   graded:  { [qid]: {correct: bool, revealed: bool} }  -- result of the LAST submit
   ============================================================ */
const STORE_KEY = 'akhlak_progress_v1';
const THEME_KEY = 'akhlak_theme_v1';  // separate key so "clear answers" never touches theme

function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { answers:{}, graded:{}, savedAt:null };
    const parsed = JSON.parse(raw);
    return { answers: parsed.answers||{}, graded: parsed.graded||{}, savedAt: parsed.savedAt||null };
  } catch(e){ return { answers:{}, graded:{}, savedAt:null }; }
}
function saveState(state){
  state.savedAt = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ /* storage full/unavailable: fail silently, keep running in-memory */ }
  return state;
}

/* ============================================================
   SHARED "is this actually answered" CHECK
   One definition, used everywhere state.answers is inspected, so
   grading, segment coloring, and the overall counter never
   disagree with each other. A container that merely EXISTS
   (an empty {} or an array of only '') is not an answer --
   the user has to have put something real into it.
   ============================================================ */
function isAnsweredValue(ans){
  if (ans === undefined || ans === '') return false;
  if (Array.isArray(ans)) return ans.length > 0 && ans.some(v => v !== '' && v !== undefined);
  if (typeof ans === 'object' && ans !== null) {
    const vals = Object.values(ans);
    return vals.length > 0 && vals.some(v => v !== '' && v !== undefined);
  }
  return true;
}

/* ============================================================
   GRADING — per section type. Each returns true/false.
   IMPORTANT (non-negotiable check #1): every comparison guards
   against '' explicitly. Never rely on `value == correctIndex`
   where an unanswered '' could coerce to 0.
   ============================================================ */
const graders = {
  objektif: (q, ans) => ans !== '' && ans !== undefined && +ans === q.correct,
  betulSalah: (q, ans) => ans !== '' && ans !== undefined && ans === q.correct, // 'betul' | 'salah'
  seretLepas: (q, ans) => {
    if (!ans || !Array.isArray(ans)) return false;
    if (ans.length !== q.blanks.length) return false;
    return q.blanks.every((correctWord, i) => ans[i] !== '' && ans[i] !== undefined && ans[i] === correctWord);
  },
  padankan: (q, ans) => {
    if (!ans || typeof ans !== 'object') return false;
    return q.pairs.every(p => ans[p.left] !== '' && ans[p.left] !== undefined && ans[p.left] === p.right);
  },
  susunUrutan: (q, ans) => {
    if (!ans || !Array.isArray(ans) || ans.length !== q.order.length) return false;
    return q.order.every((step, i) => ans[i] === step);
  },
  kenalPasti: (q, ans) => ans !== '' && ans !== undefined && +ans === q.correct,
  kesanSebab: (q, ans) => {
    // both the consequence AND the reason must match to score
    if (!ans || ans.effect === '' || ans.effect === undefined || ans.reason === '' || ans.reason === undefined) return false;
    return +ans.effect === q.correctEffect && +ans.reason === q.correctReason;
  },
  klasifikasi: (q, ans) => {
    if (!ans || typeof ans !== 'object') return false;
    return q.items.every(it => ans[it.label] !== '' && ans[it.label] !== undefined && ans[it.label] === it.bin);
  },
  situasi: (q, ans) => ans !== '' && ans !== undefined && +ans === q.correct,
  kesanSalah: (q, ans) => {
    if (!ans || ans.wordIndex === '' || ans.wordIndex === undefined || ans.replacement === '' || ans.replacement === undefined) return false;
    return +ans.wordIndex === q.wrongIndex && +ans.replacement === q.correctReplacement;
  }
};

function gradeQuestion(sectionType, q, ans){
  const fn = graders[sectionType];
  if (!fn) throw new Error('no grader for ' + sectionType);
  return !!fn(q, ans);
}

/* ============================================================
   SECTION-LEVEL GRADE + RETRY FIX
   Submit is idempotent: clicking it again always re-grades
   against whatever is currently selected. Nothing gets disabled
   after a wrong mark, so the child can change an answer and hit
   سمق جواڤن again immediately — no need to Reset the section.
   ============================================================ */
/* ============================================================
   PER-QUESTION GRADE (checking one question must never touch
   the grading state of any other question in the section)
   ============================================================ */
function gradeOneQuestion(sectionType, q, state, fasalId, sectionId){
  const qid = `${fasalId}:${sectionId}:${q.id}`;
  const ans = state.answers[qid];
  const isAnswered = isAnsweredValue(ans);
  const ok = isAnswered && gradeQuestion(sectionType, q, ans);
  state.graded[qid] = { correct: ok, attempted: isAnswered,
    revealed: (state.graded[qid] && state.graded[qid].revealed) || false };
  saveState(state);
  return ok;
}

/* ============================================================
   SECTION-LEVEL CHECK (bulk, the one سمق جواڤن button per section)
   Only grades questions that are actually answered right now --
   a still-blank question is left completely untouched (no mark,
   no false "wrong"), so filling in just one question and pressing
   the section's single check button never highlights the rest.
   Re-pressing after answering more just picks up whatever is new;
   anything already graded and unchanged keeps its existing mark.
   ============================================================ */
function gradeSection(sectionType, questions, state, fasalId, sectionId){
  let correct = 0;
  questions.forEach(q => {
    const qid = `${fasalId}:${sectionId}:${q.id}`;
    if (!isAnsweredValue(state.answers[qid])) return; // skip -- leave ungraded entirely
    if (gradeOneQuestion(sectionType, q, state, fasalId, sectionId)) correct++;
  });
  return correct; // count of correct among the ones that were actually answered
}

function resetSection(questions, state, fasalId, sectionId){
  questions.forEach(q => {
    const qid = `${fasalId}:${sectionId}:${q.id}`;
    delete state.answers[qid];
    delete state.graded[qid];
  });
  saveState(state);
}

/* ============================================================
   PROGRESS COUNTER
   overall answered/total across all 400, plus 10-segment cluster
   per fasal. Segment states: hollow(untouched) / faded(partial,
   only relevant at section granularity so segments here map
   1 segment = 1 section) / solid(complete,unsubmitted) /
   green(10/10... i.e. all-correct) / red(graded, below full).
   ============================================================ */
function sectionSegmentState(sectionType, questions, state, fasalId, sectionId){
  let answeredCount = 0, gradedCount = 0, correctCount = 0;
  questions.forEach(q => {
    const qid = `${fasalId}:${sectionId}:${q.id}`;
    const ans = state.answers[qid];
    const isAnswered = isAnsweredValue(ans);
    if (isAnswered) answeredCount++;
    const g = state.graded[qid];
    if (g){ gradedCount++; if (g.correct) correctCount++; }
  });
  if (gradedCount === questions.length && questions.length > 0){
    return correctCount === questions.length ? 'green' : 'red';
  }
  if (answeredCount === questions.length && questions.length > 0) return 'solid';
  if (answeredCount > 0) return 'faded';
  return 'hollow';
}

function overallProgress(allFasalData, state){
  let total = 0, answered = 0, correctTotal = 0, gradedTotal = 0;
  allFasalData.forEach(fasal => {
    fasal.sections.forEach(sec => {
      sec.questions.forEach(q => {
        total++;
        const qid = `${fasal.id}:${sec.id}:${q.id}`;
        const ans = state.answers[qid];
        const isAnswered = isAnsweredValue(ans);
        if (isAnswered) answered++;
        const g = state.graded[qid];
        if (g){ gradedTotal++; if (g.correct) correctTotal++; }
      });
    });
  });
  return { total, answered, correctTotal, gradedTotal };
}

const AkhlakEngineExports = { toArNum, seededShuffle, strSeed, loadState, saveState,
  graders, gradeQuestion, gradeOneQuestion, gradeSection, resetSection, isAnsweredValue,
  sectionSegmentState, overallProgress, STORE_KEY, THEME_KEY };
if (typeof module !== 'undefined' && module.exports) { module.exports = AkhlakEngineExports; }
if (typeof window !== 'undefined') { window.AkhlakEngine = AkhlakEngineExports; }

</script>
<script>
/* ============================================================
   RENDERER — DOM layer on top of engine.js (grading/shuffle/state
   already unit-tested in isolation). This file is the part that
   needs a real DOM, so it's exercised via jsdom next.
   ============================================================ */
(function(global){
const E = global.AkhlakEngine; // engine.js attaches itself here in-browser (see bottom of file)

function el(tag, attrs, children){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === 'class') n.className = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => n.appendChild(c));
  return n;
}

/* ---------- visibility helper: matches spec's non-negotiable check #3
   ("test getBoundingClientRect, not .hidden") for the reveal-answer toggle ---------- */
function isVisible(node){
  return node.getBoundingClientRect().height > 0 && !node.hasAttribute('hidden');
}

/* ================= per-type option/answer widgets ================= */

function renderObjektif(q, qid, state, container){
  const order = E.seededShuffle(q.options.map((_,i)=>i), E.strSeed(qid));
  const wrap = el('div', {class:'opts'});
  order.forEach(origIdx => {
    const row = el('label', {class:'opt-row'});
    const input = el('input', {type:'radio', name:qid});
    input.value = String(origIdx);
    input.checked = state.answers[qid] === String(origIdx);
    input.addEventListener('change', () => { state.answers[qid] = input.value; E.saveState(state); });
    row.appendChild(input);
    row.appendChild(el('span', {text:q.options[origIdx]}));
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

function renderBetulSalah(q, qid, state, container){
  const wrap = el('div', {class:'opts'});
  ['betul','salah'].forEach(v => {
    const row = el('label', {class:'opt-row'});
    const input = el('input', {type:'radio', name:qid});
    input.value = v;
    input.checked = state.answers[qid] === v;
    input.addEventListener('change', () => { state.answers[qid] = v; E.saveState(state); });
    row.appendChild(input);
    row.appendChild(el('span', {text: v === 'betul' ? 'بتول' : 'ساله'}));
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

function renderSeretLepas(q, qid, state, container){
  // works by drag AND by tap-then-tap (touch): click a chip to "arm" it,
  // then click a slot to place it. Click a filled slot to clear it back to the bank.
  // IMPORTANT: `current` starts as a local scratch array -- it is only written
  // into state.answers[qid] the moment the user actually places/clears a word,
  // never just from rendering. Otherwise every seretLepas question would look
  // "answered" in the progress counter the instant its page is opened.
  const current = state.answers[qid] || new Array(q.blanks.length).fill('');

  const stemWrap = el('div', {class:'q-stem'});
  const slots = [];
  q.stemParts.forEach((part, i) => {
    stemWrap.appendChild(document.createTextNode(part));
    if (i < q.blanks.length){
      const slot = el('span', {class:'drop-slot', text: current[i] || '…'});
      slot.dataset.idx = i;
      if (current[i]) slot.classList.add('filled');
      slot.addEventListener('click', () => {
        if (current[i]){ current[i] = ''; state.answers[qid] = current; E.saveState(state); rerenderChips(); slot.textContent='…'; slot.classList.remove('filled'); return; }
        if (armedChip !== null){
          current[i] = armedChip;
          state.answers[qid] = current; E.saveState(state);
          slot.textContent = armedChip; slot.classList.add('filled');
          armedChip = null; rerenderChips();
        }
      });
      slot.addEventListener('dragover', ev => ev.preventDefault());
      slot.addEventListener('drop', ev => {
        ev.preventDefault();
        const w = ev.dataTransfer.getData('text/plain');
        current[i] = w; state.answers[qid] = current; E.saveState(state);
        slot.textContent = w; slot.classList.add('filled');
        rerenderChips();
      });
      slots.push(slot);
      stemWrap.appendChild(slot);
    }
  });
  container.appendChild(stemWrap);
  let armedChip = null;

  const bank = el('div', {class:'word-bank'});
  function rerenderChips(){
    bank.innerHTML = '';
    q.wordBank.forEach(w => {
      const usedCount = current.filter(c => c === w).length;
      const availableInBank = q.wordBank.filter(x=>x===w).length;
      const chip = el('span', {class:'word-chip', text:w});
      if (usedCount >= availableInBank) chip.classList.add('used');
      chip.draggable = true;
      chip.addEventListener('dragstart', ev => ev.dataTransfer.setData('text/plain', w));
      chip.addEventListener('click', () => { if (!chip.classList.contains('used')){ armedChip = w; } });
      bank.appendChild(chip);
    });
  }
  rerenderChips();
  container.appendChild(bank);
}

function renderPadankan(q, qid, state, container){
  // same "don't commit until real interaction" rule as seretLepas above.
  const current = state.answers[qid] || {};
  const rightOrder = E.seededShuffle(q.pairs.map(p=>p.right), E.strSeed(qid));
  const wrap = el('div', {class:'match-col'});
  q.pairs.forEach(p => {
    const row = el('div', {class:'pair-row'});
    row.appendChild(el('div', {class:'q-stem', text:p.left}));
    const sel = el('select');
    sel.appendChild(el('option', {value:''}, [document.createTextNode('— ڤيليه —')]));
    rightOrder.forEach(r => {
      const o = el('option', {value:r}, [document.createTextNode(r)]);
      if (current[p.left] === r) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => { current[p.left] = sel.value; state.answers[qid] = current; E.saveState(state); });
    row.appendChild(sel);
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

function renderSusunUrutan(q, qid, state, container){
  // seeded shuffle is deterministic per qid, so recomputing it fresh on every
  // render (instead of writing it into state.answers at render time) still
  // looks stable to the user -- it just doesn't falsely count as "answered"
  // until they actually move something.
  const current = state.answers[qid] || E.seededShuffle(q.order, E.strSeed(qid+':init'));
  const list = el('ul', {class:'order-list'});
  function draw(){
    list.innerHTML = '';
    current.forEach((step, i) => {
      const li = el('li', {class:'order-item'});
      li.appendChild(el('span', {class:'order-handle', text:'☰'}));
      li.appendChild(el('span', {text: step}));
      // tap-friendly up/down instead of relying only on drag, per touch requirement
      const up = el('button', {type:'button', text:'▲'});
      up.disabled = i===0;
      up.addEventListener('click', () => { [current[i-1],current[i]]=[current[i],current[i-1]]; state.answers[qid] = current; E.saveState(state); draw(); });
      const down = el('button', {type:'button', text:'▼'});
      down.disabled = i===current.length-1;
      down.addEventListener('click', () => { [current[i+1],current[i]]=[current[i],current[i+1]]; state.answers[qid] = current; E.saveState(state); draw(); });
      li.appendChild(up); li.appendChild(down);
      list.appendChild(li);
    });
  }
  draw();
  container.appendChild(list);
}

function renderKenalPasti(q, qid, state, container){
  renderObjektif(q, qid, state, container); // same interaction shape, different content semantics
}

function renderKesanSebab(q, qid, state, container){
  const current = state.answers[qid] || { effect:'', reason:'' };
  ['effect','reason'].forEach(key => {
    const label = key === 'effect' ? 'كسن' : 'سبب';
    container.appendChild(el('div', {class:'q-stem', text:label + ':'}));
    const opts = key === 'effect' ? q.effectOptions : q.reasonOptions;
    const order = E.seededShuffle(opts.map((_,i)=>i), E.strSeed(qid+':'+key));
    const wrap = el('div', {class:'opts'});
    order.forEach(origIdx => {
      const row = el('label', {class:'opt-row'});
      const input = el('input', {type:'radio', name:qid+':'+key});
      input.value = String(origIdx);
      input.checked = current[key] === String(origIdx);
      input.addEventListener('change', () => { current[key] = input.value; state.answers[qid] = current; E.saveState(state); });
      row.appendChild(input);
      row.appendChild(el('span', {text:opts[origIdx]}));
      wrap.appendChild(row);
    });
    container.appendChild(wrap);
  });
}

function renderKlasifikasi(q, qid, state, container){
  const current = state.answers[qid] || {};
  const binsWrap = el('div', {});
  const bins = {};
  q.binNames.forEach(name => {
    const bin = el('div', {class:'bin'});
    bin.appendChild(el('div', {class:'bin-title', text:name}));
    const dropArea = el('div', {});
    bin.appendChild(dropArea);
    bins[name] = dropArea;
    binsWrap.appendChild(bin);
  });
  container.appendChild(binsWrap);
  const bank = el('div', {class:'word-bank'});
  const items = E.seededShuffle(q.items, E.strSeed(qid));
  function place(item, binName){
    current[item.label] = binName; state.answers[qid] = current; E.saveState(state); draw();
  }
  function draw(){
    Object.values(bins).forEach(b => b.innerHTML = '');
    bank.innerHTML = '';
    items.forEach(it => {
      const placedIn = current[it.label];
      const chip = el('span', {class:'word-chip', text:it.label});
      chip.addEventListener('click', () => {
        // tap chip -> tap a bin name shown as a quick menu (touch-friendly, no drag required)
        const menu = el('select');
        menu.appendChild(el('option', {value:''}, [document.createTextNode('— ڤيليه بهاݢين —')]));
        q.binNames.forEach(n => menu.appendChild(el('option', {value:n}, [document.createTextNode(n)])));
        menu.addEventListener('change', () => { if (menu.value) place(it, menu.value); menu.remove(); });
        chip.appendChild(menu);
      });
      if (placedIn && bins[placedIn]) bins[placedIn].appendChild(chip);
      else bank.appendChild(chip);
    });
  }
  draw();
  container.appendChild(bank);
}

function renderSituasi(q, qid, state, container){
  renderObjektif(q, qid, state, container);
}

function renderKesanSalah(q, qid, state, container){
  const current = state.answers[qid] || { wordIndex:'', replacement:'' };
  const sentence = el('div', {class:'q-stem'});
  q.sentenceWords.forEach((w, i) => {
    const span = el('span', {text:w + ' '});
    span.style.cursor = 'pointer';
    span.style.padding = '2px';
    if (String(current.wordIndex) === String(i)) span.style.background = 'var(--brass)';
    span.addEventListener('click', () => {
      current.wordIndex = String(i); state.answers[qid] = current; E.saveState(state);
      sentence.querySelectorAll('span').forEach(s=>s.style.background='');
      span.style.background = 'var(--brass)';
    });
    sentence.appendChild(span);
  });
  container.appendChild(sentence);
  const replWrap = el('div', {class:'opts'});
  const order = E.seededShuffle(q.replacementOptions.map((_,i)=>i), E.strSeed(qid+':repl'));
  order.forEach(origIdx => {
    const row = el('label', {class:'opt-row'});
    const input = el('input', {type:'radio', name:qid+':repl'});
    input.value = String(origIdx);
    input.checked = current.replacement === String(origIdx);
    input.addEventListener('change', () => { current.replacement = input.value; state.answers[qid] = current; E.saveState(state); });
    row.appendChild(input);
    row.appendChild(el('span', {text:q.replacementOptions[origIdx]}));
    replWrap.appendChild(row);
  });
  container.appendChild(replWrap);
}

const RENDERERS = {
  objektif: renderObjektif, betulSalah: renderBetulSalah, seretLepas: renderSeretLepas,
  padankan: renderPadankan, susunUrutan: renderSusunUrutan, kenalPasti: renderKenalPasti,
  kesanSebab: renderKesanSebab, klasifikasi: renderKlasifikasi, situasi: renderSituasi,
  kesanSalah: renderKesanSalah
};

/* ================= section shell: renders N questions + Submit/Reset =================
   RETRY FIX lives here: inputs are never disabled after grading, and the
   Submit handler is reattached to always re-run gradeSection against the
   CURRENT state.answers — so "salah -> reselect -> سمق" just works. */
function renderSection(fasal, section, state, container, onProgress){
  const box = el('div', {class:'card', id: `sec-${fasal.id}-${section.id}`});
  const head = el('div', {class:'section-head'});
  head.appendChild(el('span', {}, [
    el('span', {class:'section-badge', text:E.toArNum(section.badgeNum)}),
    el('span', {text:section.title})
  ]));
  const scoreEl = el('span', {class:'section-score'});
  head.appendChild(scoreEl);
  box.appendChild(head);

  function currentScoreLabel(){
    let graded = 0, correct = 0;
    section.questions.forEach(q => {
      const qid = `${fasal.id}:${section.id}:${q.id}`;
      const g = state.graded[qid];
      if (g){ graded++; if (g.correct) correct++; }
    });
    return graded > 0 ? `${E.toArNum(correct)}/${E.toArNum(section.questions.length)}` : '';
  }
  scoreEl.textContent = currentScoreLabel();

  section.questions.forEach((q, qi) => {
    const qid = `${fasal.id}:${section.id}:${q.id}`;
    const qBlock = el('div', {class:'q-block'});
    if (q.stem) qBlock.appendChild(el('div', {class:'q-stem', text: `${E.toArNum(qi+1)}. ${q.stem}`}));
    RENDERERS[section.type](q, qid, state, qBlock);

    const markRow = el('div', {class:'mark-row'});
    const g = state.graded[qid];
    // a question only carries a mark once the section's سمق جواڤن button has
    // graded it -- and that only happens for questions that are actually
    // answered (gradeSection skips blanks), so an untouched question just
    // stays open with no mark at all, never a false ✗.
    if (g){
      if (g.correct){
        markRow.appendChild(el('span', {class:'mark-icon', text:'✓ بتول'}));
        markRow.style.color = 'var(--green)';
      } else {
        markRow.appendChild(el('span', {class:'mark-icon', text:'✗ ساله'}));
        markRow.style.color = 'var(--red)';
        const revealBtn = el('button', {type:'button', class:'reveal-btn', text:'تونجوق جواڤن'});
        const revealDiv = el('div', {class:'reveal-answer', text: q.answerText || ''});
        if (g.revealed) revealDiv.classList.add('shown');
        revealBtn.addEventListener('click', () => {
          g.revealed = !g.revealed; E.saveState(state);
          revealDiv.classList.toggle('shown');
        });
        markRow.appendChild(revealBtn);
        qBlock.appendChild(markRow);
        qBlock.appendChild(revealDiv);
        box.appendChild(qBlock);
        return;
      }
    }
    qBlock.appendChild(markRow);
    box.appendChild(qBlock);
  });

  const actions = el('div', {class:'section-actions'});
  const checkBtn = el('button', {type:'button', class:'btn btn-submit', text:'سمق جواڤن'});
  checkBtn.addEventListener('click', () => {
    E.gradeSection(section.type, section.questions, state, fasal.id, section.id);
    renderSection(fasal, section, state, container, onProgress);
    onProgress();
  });
  const resetBtn = el('button', {type:'button', class:'btn btn-reset', text:'چوبا لاݢي'});
  resetBtn.addEventListener('click', () => {
    if (!confirm('ڤادم سموا جواڤن دالم بهاݢين اين؟')) return;
    E.resetSection(section.questions, state, fasal.id, section.id);
    renderSection(fasal, section, state, container, onProgress);
    onProgress();
  });
  actions.appendChild(checkBtn);
  actions.appendChild(resetBtn);
  box.appendChild(actions);

  container.innerHTML = '';
  container.appendChild(box);
}

global.AkhlakRenderer = { el, isVisible, RENDERERS, renderSection };
})(typeof window !== 'undefined' ? window : global);

</script>

<script>
/* ============================================================
   APP — orchestration layer. Wires engine.js + renderer.js +
   the 7 fasal quiz banks + notes + glossary into the 3-page shell.
   ============================================================ */
(function(){
const E = window.AkhlakEngine;
const R = window.AkhlakRenderer;
const el = R.el;

const BANK = [QUIZ_F1, QUIZ_F2, QUIZ_F3, QUIZ_F4, QUIZ_F5, QUIZ_F6, QUIZ_F7];
const BANK_BY_ID = {}; BANK.forEach(q => BANK_BY_ID[q.id] = q);
const FASAL_TITLE = {}; FASAL_META.forEach(f => FASAL_TITLE[f.id] = f);

let state = E.loadState();
let activePage = 'notes';       // 'notes' | 'quiz' | 'gloss'
let activeNotesFasal = 'f1';
let activeQuizFasal = 'f1';
let activeGlossFasal = 'all';
let glossQuery = '';

/* ---------- theme ---------- */
function loadTheme(){
  try { return localStorage.getItem(E.THEME_KEY) || 'light'; } catch(e){ return 'light'; }
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  try { localStorage.setItem(E.THEME_KEY, t); } catch(e){}
}
let theme = loadTheme();
applyTheme(theme);

/* ============================================================
   STICKY HEADER + MIZAN COUNTER — rendered once, refreshed after
   every submit/reset, present identically on all 3 pages.
   ============================================================ */
const header = document.getElementById('app-header');

function renderHeader(){
  header.innerHTML = '';
  const tabbar = el('div', {class:'tabbar'});
  [['notes','نوتا'], ['quiz','كويز'], ['gloss','ݢلوساري']].forEach(([key,label]) => {
    const btn = el('button', {type:'button', text:label});
    if (activePage === key) btn.classList.add('active');
    btn.addEventListener('click', () => { activePage = key; renderAll(); });
    tabbar.appendChild(btn);
  });
  const themeBtn = el('button', {type:'button', class:'theme-toggle', text: theme==='dark' ? '\u2600' : '\u263D'});
  themeBtn.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    renderHeader();
  });
  tabbar.appendChild(themeBtn);
  header.appendChild(tabbar);

  // ---- Mizan counter bar: always rendered, all 3 pages, sticky under the tabs ----
  const counterBar = el('div', {class:'counter-bar'});
  const prog = E.overallProgress(BANK, state);
  const totalLabel = el('div', {class:'counter-total'});
  totalLabel.innerHTML = ''; // build with real nodes, not innerHTML injection of variable text
  totalLabel.appendChild(document.createTextNode('جواڤن: '));
  const bEl = document.createElement('b');
  bEl.textContent = `${E.toArNum(prog.answered)}/${E.toArNum(prog.total)}`;
  totalLabel.appendChild(bEl);
  counterBar.appendChild(totalLabel);

  const track = el('div', {class:'mizan-track'});
  BANK.forEach(quiz => {
    const cluster = el('div', {class:'mizan-cluster'});
    const segRow = el('div', {class:'seg-row'});
    quiz.sections.forEach(sec => {
      const st = E.sectionSegmentState(sec.type, sec.questions, state, quiz.id, sec.id);
      const segBtn = el('button', {type:'button', class:'seg ' + st});
      // pressing a segment jumps straight to THAT section's card, not just
      // the top of the fasal's quiz page -- this is the actual fix requested.
      segBtn.addEventListener('click', () => { jumpToSection(quiz.id, sec.id); });
      segRow.appendChild(segBtn);
    });
    cluster.appendChild(segRow);
    const label = el('button', {type:'button', class:'fasal-label', text: FASAL_TITLE[quiz.id].title});
    label.addEventListener('click', () => { jumpToSection(quiz.id, quiz.sections[0].id); });
    cluster.appendChild(label);
    track.appendChild(cluster);
  });
  counterBar.appendChild(track);

  const correctReadout = el('span', {class:'correct-readout'});
  correctReadout.textContent = prog.gradedTotal > 0
    ? `\u2713 ${E.toArNum(prog.correctTotal)}/${E.toArNum(prog.gradedTotal)}`
    : '';
  counterBar.appendChild(correctReadout);

  header.appendChild(counterBar);
}

/* ---------- lightweight highlight markup: **term** -> <mark class="hl">term</mark>
   content is authored by us (data-notes.js), so this is safe to render as HTML ---------- */
function hlText(s){
  const esc = String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/\*\*(.+?)\*\*/g, '<mark class="hl">$1</mark>');
}

/* ============================================================
   NOTES PAGE
   ============================================================ */
const notesRoot = document.getElementById('page-notes');
function renderNotes(){
  notesRoot.innerHTML = '';
  const tabs = el('div', {class:'fasal-tabs'});
  FASAL_META.forEach(f => {
    const btn = el('button', {type:'button', text: `${E.toArNum(f.num)}. ${f.title}`});
    if (activeNotesFasal === f.id) btn.classList.add('active');
    btn.addEventListener('click', () => { activeNotesFasal = f.id; renderNotes(); });
    tabs.appendChild(btn);
  });
  notesRoot.appendChild(tabs);

  const n = NOTES[activeNotesFasal];
  const meta = FASAL_TITLE[activeNotesFasal];

  const dalilBox = el('div', {class:'dalil-box'});
  dalilBox.appendChild(el('div', {class:'ayat-ar jawi-head', text:n.dalil.ar}));
  dalilBox.appendChild(el('div', {class:'ayat-ref', text:n.dalil.ref}));
  dalilBox.appendChild(el('div', {class:'ayat-meaning', text:n.dalil.meaning}));
  notesRoot.appendChild(dalilBox);

  const ringkasanCard = el('div', {class:'card'});
  ringkasanCard.appendChild(el('h3', {class:'jawi-head', text:'رينڬكسن'}));
  const ringkasanP = el('p', {});
  ringkasanP.innerHTML = hlText(n.ringkasan);
  ringkasanCard.appendChild(ringkasanP);
  notesRoot.appendChild(ringkasanCard);

  const kpCard = el('div', {class:'card'});
  kpCard.appendChild(el('h3', {class:'jawi-head', text:'ايسي ڤنتيڠ'}));
  const ul = el('ul', {class:'key-points'});
  n.keyPoints.forEach(k => { const li = el('li', {}); li.innerHTML = hlText(k); ul.appendChild(li); });
  kpCard.appendChild(ul);
  notesRoot.appendChild(kpCard);

  if (n.table){
    const tblCard = el('div', {class:'card'});
    tblCard.appendChild(el('h3', {class:'jawi-head', text:n.table.title}));
    const table = el('table', {class:'ref-table'});
    const thead = el('tr', {});
    n.table.headers.forEach(h => thead.appendChild(el('th', {text:h})));
    table.appendChild(thead);
    n.table.rows.forEach(row => {
      const tr = el('tr', {});
      row.forEach(cell => tr.appendChild(el('td', {text:cell})));
      table.appendChild(tr);
    });
    tblCard.appendChild(table);
    notesRoot.appendChild(tblCard);
  }

  const mmCard = el('div', {class:'card'});
  mmCard.appendChild(el('h3', {class:'jawi-head', text:'ڤيتا ميندا'}));
  const mm = el('div', {class:'mindmap'});
  mm.appendChild(el('div', {class:'root', text:n.mindmap.root}));
  const branchesWrap = el('div', {class:'branches'});
  n.mindmap.branches.forEach(b => {
    const branchEl = el('div', {class:'branch'});
    branchEl.appendChild(el('div', {text:b.label, style:''}));
    const leafsEl = el('ul', {class:'leafs'});
    b.leafs.forEach(lf => { const li = el('li', {}); li.innerHTML = hlText(lf); leafsEl.appendChild(li); });
    branchEl.appendChild(leafsEl);
    branchesWrap.appendChild(branchEl);
  });
  mm.appendChild(branchesWrap);
  mmCard.appendChild(mm);
  notesRoot.appendChild(mmCard);

  const tipBox = el('div', {class:'tip-box'});
  tipBox.appendChild(el('strong', {text:'ڤيتوا: '}));
  const tipSpan = el('span', {});
  tipSpan.innerHTML = hlText(n.tip);
  tipBox.appendChild(tipSpan);
  notesRoot.appendChild(tipBox);
}

/* ============================================================
   QUIZ PAGE
   ============================================================ */
const quizRoot = document.getElementById('page-quiz');
function renderQuiz(){
  quizRoot.innerHTML = '';
  const tabs = el('div', {class:'fasal-tabs'});
  FASAL_META.forEach(f => {
    const btn = el('button', {type:'button', text: `${E.toArNum(f.num)}. ${f.title}`});
    if (activeQuizFasal === f.id) btn.classList.add('active');
    btn.addEventListener('click', () => { activeQuizFasal = f.id; renderQuiz(); });
    tabs.appendChild(btn);
  });
  quizRoot.appendChild(tabs);

  const quiz = BANK_BY_ID[activeQuizFasal];
  quiz.sections.forEach(sec => {
    const secContainer = el('div', {});
    quizRoot.appendChild(secContainer);
    R.renderSection(quiz, sec, state, secContainer, refreshChrome);
  });

  const savedRow = el('div', {class:'saved-at'});
  savedRow.textContent = state.savedAt
    ? '\u2713 disimpan automatik'
    : '';
  quizRoot.appendChild(savedRow);

  const clearBtn = el('button', {type:'button', class:'clear-all-btn', text:'\u0680\u0627\u062F\u0645 \u0633\u0645\u0648\u0627 \u062C\u0648\u0627\u06A4\u0646'});
  clearBtn.addEventListener('click', () => {
    if (!confirm('ڤادم سموا جواڤن دالم اڤليكاسي اين؟ تيندقن اين تيدق بوليه دباتلكن.')) return;
    BANK.forEach(q => q.sections.forEach(sec => E.resetSection(sec.questions, state, q.id, sec.id)));
    renderAll();
  });
  quizRoot.appendChild(clearBtn);
}

/* ============================================================
   GLOSSARY PAGE
   ============================================================ */
const glossRoot = document.getElementById('page-gloss');
function renderGloss(){
  glossRoot.innerHTML = '';
  const search = el('input', {class:'search-box', type:'text', placeholder:'چاري ڤركاتأن...'});
  search.value = glossQuery;
  search.addEventListener('input', () => { glossQuery = search.value; renderGlossList(); });
  glossRoot.appendChild(search);

  const chips = el('div', {class:'filter-chips'});
  const allChip = el('button', {type:'button', text:'سموا'});
  if (activeGlossFasal === 'all') allChip.classList.add('active');
  allChip.addEventListener('click', () => { activeGlossFasal = 'all'; renderGloss(); });
  chips.appendChild(allChip);
  FASAL_META.forEach(f => {
    const chip = el('button', {type:'button', text:f.title});
    if (activeGlossFasal === f.id) chip.classList.add('active');
    chip.addEventListener('click', () => { activeGlossFasal = f.id; renderGloss(); });
    chips.appendChild(chip);
  });
  glossRoot.appendChild(chips);

  const listWrap = el('div', {id:'gloss-list'});
  glossRoot.appendChild(listWrap);
  renderGlossList();
}
function renderGlossList(){
  const listWrap = document.getElementById('gloss-list');
  if (!listWrap) return;
  listWrap.innerHTML = '';
  const q = glossQuery.trim();
  const items = GLOSSARY.filter(g => {
    if (activeGlossFasal !== 'all' && g.fasal !== activeGlossFasal) return false;
    if (q && !g.term.includes(q) && !g.def.includes(q)) return false;
    return true;
  });
  if (items.length === 0){
    listWrap.appendChild(el('p', {text:'تيادا ڤركاتأن دجومڤاءي.'}));
    return;
  }
  items.forEach(g => {
    const item = el('div', {class:'gloss-item'});
    item.appendChild(el('div', {class:'gloss-term', text:g.term}));
    item.appendChild(el('div', {class:'gloss-fasal-tag', text:FASAL_TITLE[g.fasal].title}));
    item.appendChild(el('div', {text:g.def}));
    listWrap.appendChild(item);
  });
}

/* ============================================================
   PAGE SWITCH + MASTER RENDER
   ============================================================ */
function refreshChrome(){ renderHeader(); }

function jumpToSection(fasalId, sectionId){
  activePage = 'quiz';
  activeQuizFasal = fasalId;
  renderAll();
  const target = document.getElementById(`sec-${fasalId}-${sectionId}`);
  if (target && typeof target.scrollIntoView === 'function') target.scrollIntoView({ behavior:'smooth', block:'start' });
}

function renderAll(){
  renderHeader();
  document.getElementById('page-notes').classList.toggle('active', activePage==='notes');
  document.getElementById('page-quiz').classList.toggle('active', activePage==='quiz');
  document.getElementById('page-gloss').classList.toggle('active', activePage==='gloss');
  if (activePage === 'notes') renderNotes();
  else if (activePage === 'quiz') renderQuiz();
  else renderGloss();
}

renderAll();
})();

</script>
</body>
</html>
